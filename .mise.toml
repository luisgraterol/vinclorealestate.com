# Variables solo para este repo (requiere `mise activate` en el shell).
# Aíslan la AWS CLI de Vinclo del resto de la máquina (p. ej. la config de Bops).
[env]
AWS_CONFIG_FILE = "{{env.HOME}}/.aws/vinclo-config"
AWS_PROFILE = "vinclo"
# Terragrunt 1.x prefiere OpenTofu si está instalado; aquí usamos Terraform (igual que CI).
TG_TF_PATH = "terraform"
