name: srv

on:
  pull_request:
    branches: [main]
    paths: ["srv/**", ".github/workflows/srv.yml"]
  push:
    branches: [main]
    paths: ["srv/**", ".github/workflows/srv.yml"]
  workflow_dispatch:
    inputs:
      task:
        description: Task de ECS a correr
        type: choice
        options: [web-extractor, normalize]
        required: true
      args:
        description: 'Argumentos, ej. "--job nashville-str-permits" o "--dataset leads"'
        type: string
        required: true

permissions:
  contents: read

env:
  POETRY_VERSION: "2.5.2"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  test:
    name: Lint y tests
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: srv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install "poetry==${POETRY_VERSION}"
      - uses: actions/cache@v4
        with:
          path: srv/.venv
          key: srv-venv-${{ runner.os }}-py312-${{ hashFiles('srv/poetry.lock') }}
      - run: poetry install --no-interaction
      - run: poetry run ruff check .
      - run: poetry run ruff format --check .
      - run: poetry run pytest

  image:
    name: Build (y push en main)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Solo publica en main y cuando ya existe la cuenta de AWS (variable del repo).
      PUBLISH: ${{ github.event_name == 'push' && vars.AWS_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Credenciales de AWS
        if: env.PUBLISH == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gha-vinclo-tasks
          aws-region: ${{ env.AWS_REGION }}
      - name: Login a ECR
        id: ecr
        if: env.PUBLISH == 'true'
        uses: aws-actions/amazon-ecr-login@v2
      - name: Tags
        id: tags
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            echo "tags=${REGISTRY}/vinclo-tasks:${GITHUB_SHA},${REGISTRY}/vinclo-tasks:prod" >> "$GITHUB_OUTPUT"
          else
            echo "tags=vinclo-tasks:ci" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: srv
          platforms: linux/amd64
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ steps.tags.outputs.tags }}
          push: ${{ env.PUBLISH == 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  run:
    name: Correr task en ECS
    if: github.event_name == 'workflow_dispatch' && vars.AWS_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gha-vinclo-tasks
          aws-region: ${{ env.AWS_REGION }}
      - name: aws ecs run-task
        env:
          TASK: ${{ inputs.task }}
          ARGS: ${{ inputs.args }}
        run: |
          cfg=$(aws ssm get-parameter --name /vinclo/tasks/run-task --query Parameter.Value --output text)
          network=$(jq -c '{awsvpcConfiguration: {subnets: .subnets, securityGroups: .securityGroups, assignPublicIp: "ENABLED"}}' <<<"$cfg")
          overrides=$(jq -nc --arg t "$TASK" --arg a "$ARGS" \
            '{containerOverrides: [{name: "main", command: ([$t] + ($a | split(" ") | map(select(. != ""))))}]}')
          aws ecs run-task \
            --cluster "$(jq -r .cluster <<<"$cfg")" \
            --task-definition "$TASK" \
            --launch-type FARGATE \
            --network-configuration "$network" \
            --overrides "$overrides" \
            --query 'tasks[0].taskArn' --output text
